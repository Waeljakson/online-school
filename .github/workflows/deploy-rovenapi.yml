name: Deploy ROVEN Neon Function

on:
  push:
    branches: [main]
    paths:
      - "neon-functions/rovenapi/**"
      - ".github/workflows/deploy-rovenapi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY || vars.NEON_API_KEY }}
      NEON_BRANCH_ID: br-round-hall-b5qw20e0
      NEON_FUNCTION_SLUG: rovenapi
    steps:
      - uses: actions/checkout@v4

      - name: Check Neon API key
        shell: bash
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error::NEON_API_KEY is missing."
            exit 1
          fi

      - name: Install Neon CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g neon
          neon --version

      - name: Resolve Neon project from production branch
        shell: bash
        run: |
          set -euo pipefail
          neon orgs list --output json > /tmp/neon-orgs.json

          PROJECT_ID="$(
            node <<'NODE'
            const fs=require('fs');
            const cp=require('child_process');
            const orgsRaw=JSON.parse(fs.readFileSync('/tmp/neon-orgs.json','utf8'));
            const orgs=Array.isArray(orgsRaw)?orgsRaw:(orgsRaw.organizations||[]);
            const branchId=process.env.NEON_BRANCH_ID;
            let found='';

            for(const org of orgs){
              const orgId=org.id||org.org_id;
              if(!orgId) continue;
              let projects=[];
              try{
                const out=cp.execFileSync('neon',['projects','list','--org-id',orgId,'--output','json'],{
                  env:process.env,encoding:'utf8',stdio:['ignore','pipe','ignore']
                });
                const parsed=JSON.parse(out);
                projects=Array.isArray(parsed)?parsed:(parsed.projects||[]);
              }catch{
                continue;
              }

              for(const p of projects){
                const pid=p.id||p.project_id;
                if(!pid) continue;
                try{
                  const out=cp.execFileSync('neon',['branches','list','--project-id',pid,'--output','json'],{
                    env:process.env,encoding:'utf8',stdio:['ignore','pipe','ignore']
                  });
                  const branches=JSON.parse(out);
                  const list=Array.isArray(branches)?branches:(branches.branches||[]);
                  if(list.some(b=>String(b.id)===branchId)){
                    found=pid;
                    break;
                  }
                }catch{}
              }
              if(found) break;
            }

            if(!found) process.exit(2);
            process.stdout.write(found);
            NODE
          )"

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Could not resolve project for branch $NEON_BRANCH_ID"
            exit 1
          fi

          echo "NEON_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Resolved Neon project successfully."

      - name: Deploy rovenapi
        shell: bash
        run: |
          set -euo pipefail
          neon functions deploy "$NEON_FUNCTION_SLUG"             --src neon-functions/rovenapi/index.mjs             --branch "$NEON_BRANCH_ID"             --project-id "$NEON_PROJECT_ID"             --runtime nodejs24             --wait

      - name: Verify active function
        shell: bash
        run: |
          set -euo pipefail
          neon functions get "$NEON_FUNCTION_SLUG"             --branch "$NEON_BRANCH_ID"             --project-id "$NEON_PROJECT_ID"             --output json > /tmp/roven-function.json
          cat /tmp/roven-function.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/roven-function.json','utf8'));
          const d=x.current_deployment||x.active_deployment||x.function?.current_deployment||x.function?.active_deployment||{};
          const status=String(d.status||'').toLowerCase();
          if(!['completed','ready','active'].includes(status)){
            console.error('Unexpected deployment status:',status||'missing');
            process.exit(1);
          }
          console.log('rovenapi deployment verified:',status);
          NODE
